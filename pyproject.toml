[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uuv-navigation-reference"
version = "0.1.0"
description = "水下机器人多候选导航参考实现：候选生成、约束修正、视觉世界模型预测、风险选择与控制器接口"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "torch"]

[tool.setuptools.packages.find]
include = ["uuv_navigation*"]
